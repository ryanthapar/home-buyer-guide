<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homes We Have Sold and Bought | The Thapar Team</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1f2933}
#app{display:flex;height:100%}
#side{width:340px;max-width:42vw;display:flex;flex-direction:column;border-right:1px solid #d9dee3;background:#fff}
#head{padding:14px 16px;border-bottom:1px solid #e6eaee}
h1{font-size:17px;margin:0 0 2px}.sub{font-size:12px;color:#66727f}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:#f4f6f8;border-radius:8px;padding:8px 10px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#66727f}
.filters{padding:10px 16px;border-bottom:1px solid #e6eaee;font-size:13px}
.filters label{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer}
.chip{border:1px solid #c5ccd3;border-radius:14px;padding:3px 11px;font-size:12px;cursor:pointer;background:#fff;user-select:none}.chip.on{background:#1f2933;color:#fff;border-color:#1f2933}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px #0003}
#list{overflow:auto;flex:1}
.row{padding:8px 16px;border-bottom:1px solid #f0f2f4;cursor:pointer;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.row:hover{background:#f7f9fb}.row .a{font-weight:600}.row .m{color:#66727f;font-size:12px}
#map{flex:1;background:#e9eef2}
.pop b{font-size:14px}.pop table{border-collapse:collapse;margin-top:6px;font-size:12px}.pop td{padding:2px 8px 2px 0;vertical-align:top}.pop td:first-child{color:#66727f}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;color:#fff;font-size:11px;margin-left:6px}
.note{position:absolute;z-index:500;right:10px;bottom:10px;background:#fffd;border-radius:6px;padding:4px 8px;font-size:11px;color:#55616d}
.ref{background:none;border:none;font-size:11px;color:#6b7785;font-style:italic;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff}
.back{display:inline-block;font-size:12px;color:#66727f;text-decoration:none;margin-bottom:6px}.back:hover{color:#0B6B66;text-decoration:underline}
.embed .back{display:none}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:1000;background:#fff;color:#55616d}
</style>
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.className+=' embed'</script>
</head><body>
<div id="app">
<div id="side">
 <div id="head"><a class="back" href="index.html#s11">&larr; Home Buyer Guide</a><h1>Sales Map — Monica Thapar</h1><div class="sub">Snobar Realty Group Inc. · Toronto MLS · <span id="yrs"></span></div>
  <div class="stats"><div class="stat"><b id="sN"></b><span>homes sold or bought</span></div><div class="stat"><b id="sV"></b><span>total volume</span></div>
  <div class="stat"><b id="sA"></b><span>average sold price</span></div><div class="stat"><b id="sD"></b><span>average days on market</span></div></div></div>
 <div class="filters"><div id="years" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px"></div>
  <label><input type="checkbox" id="fSeller" checked><span class="dot" style="background:#1f9d55"></span><span>Represented the <b>seller</b> (<span id="cS"></span>)</span></label>
  <label><input type="checkbox" id="fBuyer" checked><span class="dot" style="background:#e8710a"></span><span>Represented the <b>buyer</b> (<span id="cB"></span>)</span></label>
 </div>
 <div id="list"></div>
</div>
<div id="map"></div>
<div id="msg" role="status"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script>
fetch('data/sales.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('missing');return r.json()}).then(function(d){
const D=d.records||[];
if(!D.length)throw new Error('empty');
const COL={Seller:'#1f9d55',Buyer:'#e8710a'};
const fmt=n=>'$'+Math.round(n).toLocaleString('en-CA');
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([43.69,-79.55],12);
// Street tiles load where the page is allowed to fetch images (e.g. opened as a file); blocked silently in sandboxed viewers.
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
// Reference landmarks so the map reads without a basemap
[['Kipling Stn',43.6371,-79.5360],['Islington Stn',43.6456,-79.5246],['Royal York Stn',43.6481,-79.5113],['Union Station',43.6453,-79.3806],['Lake Ontario ↓',43.600,-79.52]].forEach(([n,a,b])=>
 L.marker([a,b],{icon:L.divIcon({className:'ref',html:n,iconSize:null}),interactive:false}).addTo(map));
const YEARS=[...new Set(D.map(o=>o.year))].sort();
const activeYears=new Set(YEARS);
const sideOn={Seller:true,Buyer:true};
yrs.textContent=YEARS.join(', ');
const markers={};
D.forEach(o=>{
 const m=L.circleMarker([o.lat,o.lng],{radius:8,color:'#fff',weight:2,fillColor:COL[o.side],fillOpacity:.95});
 m.bindPopup(`<div class="pop"><b>${o.addr}</b><span class="tag" style="background:${COL[o.side]}">${o.side==='Seller'?'Repped seller':'Repped buyer'}</span><div style="font-size:12px;color:#66727f">${o.city} ${o.zip} · ${o.type}</div>
 <table><tr><td>Sold price</td><td><b>${fmt(o.price)}</b></td></tr><tr><td>Sold date</td><td>${o.date}</td></tr>
 <tr><td>Sold / asked</td><td>${(o.ratio*100).toFixed(1)}%</td></tr><tr><td>Days on market</td><td>${o.dom}</td></tr>
 <tr><td>MLS#</td><td>${o.mls}</td></tr><tr><td>${o.side==='Seller'?'Buyer’s agent':'Seller’s agent'}</td><td>${o.other||'—'}</td></tr></table>${o.approx?'<div style="color:#b45309;font-size:11px;margin-top:4px">Approximate location: exact address not found, placed on its street or nearest town</div>':''}</div>`);
 markers[o.id]=m;
});
const list=document.getElementById('list');
const rows={};
D.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(o=>{
 const r=document.createElement('div');r.className='row';
 r.innerHTML=`<span class="dot" style="background:${COL[o.side]};margin-top:3px"></span><div><div class="a">${o.addr}</div><div class="m">${o.city} · ${o.type} · ${fmt(o.price)} · ${o.date}</div></div>`;
 r.onclick=()=>{map.setView([o.lat,o.lng],Math.max(map.getZoom(),15));markers[o.id].openPopup()};
 list.appendChild(r);rows[o.id]=r;
});
const visible=o=>activeYears.has(o.year)&&sideOn[o.side];
function refresh(){
 const on=D.filter(visible);
 D.forEach(o=>{const v=visible(o);v?markers[o.id].addTo(map):map.removeLayer(markers[o.id]);rows[o.id].style.display=v?'':'none'});
 const v=on.reduce((s,o)=>s+o.price,0);
 sN.textContent=on.length;sV.textContent=on.length?'$'+(v/1e6).toFixed(1)+'M':'—';
 sA.textContent=on.length?fmt(v/on.length):'—';sD.textContent=on.length?Math.round(on.reduce((s,o)=>s+o.dom,0)/on.length):'—';
 const yo=D.filter(o=>activeYears.has(o.year));
 cS.textContent=yo.filter(o=>o.side==='Seller').length;cB.textContent=yo.filter(o=>o.side==='Buyer').length;
}
function fit(){const p=D.filter(o=>visible(o)&&o.city==='Toronto').map(o=>[o.lat,o.lng]);if(p.length)map.fitBounds(L.latLngBounds(p).pad(.1))}
YEARS.forEach(y=>{const c=document.createElement('span');c.className='chip on';c.textContent=y+' ('+D.filter(o=>o.year===y).length+')';
 c.onclick=()=>{activeYears.has(y)?activeYears.delete(y):activeYears.add(y);c.classList.toggle('on');refresh();fit()};years.appendChild(c)});
['Seller','Buyer'].forEach(s=>document.getElementById('f'+s).onchange=e=>{sideOn[s]=e.target.checked;refresh()});
refresh();fit();
}).catch(function(){var m=document.getElementById('msg');m.textContent='The map is being updated. Please check back soon.';m.style.display='flex'});
</script>
</body></html>
